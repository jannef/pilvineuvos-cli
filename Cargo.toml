[package]
name = "pilvineuvos-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for pilvineuvos throwaway email inboxes"
repository = "https://github.com/jannef/pilvineuvos-cli"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
html2text = "0.17.4"
mail-parser = "1.0.1"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "pn"
path = "src/main.rs"
